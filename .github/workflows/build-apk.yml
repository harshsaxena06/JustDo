name: Build JustDo APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing keystore and env
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build signed Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for sharing
        run: cp app/build/outputs/apk/debug/app-debug.apk JustDo.apk

      - name: Upload JustDo.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JustDo-APK
          path: JustDo.apk
